<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>EQL Tools Companion overlay</title>
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="panel">
  <header id="bar">
    <span id="zoneLine">EQL Tools Companion</span>
    <button id="btnRoll" title="Roll up to this bar">–</button>
    <button id="btnPin">pin</button>
  </header>
  <nav id="otabs">
    <button data-oview="tracked" id="otTracked">Tracked</button>
    <button data-oview="loot" id="otLoot">Loot</button>
    <button data-oview="stats" id="otStats">Stats</button>
    <button data-oview="sky" id="otSky">Sky</button>
    <button id="qView" title="Group tracked items by zone, or by quest">by zone</button>
  </nav>
  <div id="filters">
    <label><input type="checkbox" id="fKills"> kills</label>
    <label><input type="checkbox" id="fQuestOnly"> quest items only</label>
  </div>
  <ul id="quests" hidden></ul>
  <ul id="feed"></ul>
  <div id="ostats" hidden></div>
  <div id="osky" hidden></div>
</div>
<div id="grip" title="Resize"></div>
<script src="overlay.js"></script>
</body>
</html>
